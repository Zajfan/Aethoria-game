<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aeth-Ed — Aethoria Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --bg2:       #141720;
      --bg3:       #1c2030;
      --border:    #2a3050;
      --accent:    #4a7cff;
      --accent2:   #8844cc;
      --gold:      #ffcc44;
      --green:     #44cc88;
      --red:       #ff4444;
      --text:      #ccd6f6;
      --text-dim:  #667799;
      --text-head: #eef2ff;
      --radius:    6px;
      --font-mono: 'Courier New', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      overflow: hidden;
    }

    /* ── Layout ─────────────────────────────────────────────────────── */

    #shell {
      display: grid;
      grid-template-rows: 44px 1fr;
      grid-template-columns: 200px 1fr;
      height: 100vh;
    }

    /* ── Topbar ─────────────────────────────────────────────────────── */

    #topbar {
      grid-column: 1 / -1;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    #topbar h1 {
      font-size: 15px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #topbar .version {
      font-size: 10px;
      color: var(--text-dim);
      margin-left: 4px;
    }

    #topbar .spacer { flex: 1; }

    #topbar .status-pill {
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    #topbar .status-pill.ok { border-color: var(--green); color: var(--green); }
    #topbar .status-pill.warn { border-color: var(--gold); color: var(--gold); }

    /* ── Sidebar ─────────────────────────────────────────────────────── */

    #sidebar {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-group-label {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 8px 16px 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      cursor: pointer;
      color: var(--text-dim);
      border: none;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 13px;
      text-align: left;
      width: 100%;
      border-left: 3px solid transparent;
      transition: all 0.1s;
    }
    .nav-btn:hover { background: var(--bg3); color: var(--text); }
    .nav-btn.active {
      background: var(--bg3);
      color: var(--accent);
      border-left-color: var(--accent);
    }
    .nav-btn .icon { width: 16px; text-align: center; font-size: 14px; }

    /* ── Main content ────────────────────────────────────────────────── */

    #main {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .panel.active { display: flex; }

    .panel-header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .panel-header h2 { font-size: 14px; color: var(--text-head); }
    .panel-header .desc { font-size: 11px; color: var(--text-dim); }
    .panel-header .actions { margin-left: auto; display: flex; gap: 8px; }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .panel-body::-webkit-scrollbar { width: 6px; }
    .panel-body::-webkit-scrollbar-track { background: var(--bg2); }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Common widgets ──────────────────────────────────────────────── */

    .btn {
      padding: 5px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12px;
      transition: all 0.1s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { opacity: 0.85; }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: #fff; }
    .btn.success { border-color: var(--green); color: var(--green); }
    .btn.success:hover { background: var(--green); color: #000; }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
    }
    .card-title {
      padding: 10px 16px;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-body { padding: 14px 16px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 5px 8px;
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: var(--accent);
    }

    /* ── Tables ──────────────────────────────────────────────────────── */

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .data-table th {
      text-align: left;
      padding: 6px 10px;
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .data-table td {
      padding: 5px 10px;
      border-bottom: 1px solid var(--bg3);
      vertical-align: middle;
    }
    .data-table tr:hover td { background: var(--bg3); }
    .data-table td input {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      width: 100%;
      outline: none;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .data-table td input:focus {
      background: var(--bg);
      border: 1px solid var(--accent);
    }
    .data-table .tag {
      display: inline-block;
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 3px;
      margin-right: 3px;
    }
    .tag-void   { background: #440066; color: #cc88ff; }
    .tag-ranged { background: #004422; color: #44cc88; }
    .tag-burn   { background: #440000; color: #ff6644; }
    .tag-freeze { background: #001144; color: #4488ff; }
    .tag-poison { background: #224400; color: #88cc44; }

    /* ── Stat chips ──────────────────────────────────────────────────── */

    .stat-chip {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      min-width: 70px;
    }
    .stat-chip .val {
      font-size: 20px;
      color: var(--text-head);
      font-weight: bold;
    }
    .stat-chip .lbl {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* ── XP bars ─────────────────────────────────────────────────────── */

    .xp-bar-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .xp-bar-label { width: 80px; font-size: 11px; color: var(--text-dim); }
    .xp-bar-track {
      flex: 1;
      height: 8px;
      background: var(--bg3);
      border-radius: 4px;
      overflow: hidden;
    }
    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 4px;
      transition: width 0.3s;
    }
    .xp-bar-meta { font-size: 10px; color: var(--text-dim); min-width: 90px; text-align: right; }

    /* ── Quest rows ──────────────────────────────────────────────────── */

    .quest-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid var(--bg3);
    }
    .quest-row:last-child { border-bottom: none; }
    .quest-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .quest-dot.active { background: var(--gold); }
    .quest-dot.done   { background: var(--green); }
    .quest-dot.side   { background: var(--accent2); }
    .quest-title { flex: 1; }
    .quest-prog { font-size: 10px; color: var(--text-dim); }

    /* ── Toast ───────────────────────────────────────────────────────── */

    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 18px;
      font-size: 12px;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 1000;
    }
    #toast.ok  { border-color: var(--green); color: var(--green); }
    #toast.err { border-color: var(--red);   color: var(--red); }
    #toast.show { opacity: 1; }

    /* ── Filter bar ──────────────────────────────────────────────────── */

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }
    .filter-bar input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 10px;
      outline: none;
    }
    .filter-bar input:focus { border-color: var(--accent); }

    /* ── Config tab bar ──────────────────────────────────────────────── */

    .tab-bar {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      padding: 0 16px;
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 8px 14px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Diff viewer ─────────────────────────────────────────────────── */

    .diff-area {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 11px;
      color: var(--text-dim);
      max-height: 220px;
      overflow-y: auto;
      white-space: pre;
      font-family: var(--font-mono);
    }

    /* ── Inline badge ─────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      font-size: 9px;
      padding: 1px 7px;
      border-radius: 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-dim);
      margin-left: 4px;
    }
    .badge.hi { border-color: var(--gold); color: var(--gold); }

    /* ── Scrollable table wrapper ─────────────────────────────────────── */
    .table-scroll {
      overflow-x: auto;
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }
    .table-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<div id="shell">

  <!-- ── Topbar ─────────────────────────────────────────────────────── -->
  <div id="topbar">
    <h1>Aeth-Ed <span class="version">v0.1</span></h1>
    <span style="color:var(--text-dim);font-size:11px;">Aethoria Game Editor</span>
    <div class="spacer"></div>
    <span id="save-status" class="status-pill">No save loaded</span>
    <span id="game-link-pill" class="status-pill ok" style="cursor:pointer" onclick="window.open('http://localhost:8001','_blank')">Open Game</span>
  </div>

  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <nav id="sidebar">
    <div class="nav-group-label">Debug</div>
    <button class="nav-btn active" data-panel="save">
      <span class="icon">💾</span> Save Inspector
    </button>

    <div class="nav-group-label">Balance</div>
    <button class="nav-btn" data-panel="config">
      <span class="icon">⚙</span> Config Editor
    </button>
    <button class="nav-btn" data-panel="quests">
      <span class="icon">📜</span> Quest Browser
    </button>
    <button class="nav-btn" data-panel="lore">
      <span class="icon">📖</span> Lore Browser
    </button>
  </nav>

  <!-- ── Main ───────────────────────────────────────────────────────── -->
  <main id="main">

    <!-- Save Inspector -->
    <div class="panel active" id="panel-save"></div>

    <!-- Config Editor -->
    <div class="panel" id="panel-config"></div>

    <!-- Quest Browser -->
    <div class="panel" id="panel-quests"></div>

    <!-- Lore Browser -->
    <div class="panel" id="panel-lore"></div>

  </main>
</div>

<div id="toast"></div>

<script type="module" src="editor/EditorApp.js"></script>
</body>
</html>
