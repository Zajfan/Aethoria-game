appId: com.nohands.aethoria
productName: Aethoria
copyright: Copyright © 2026 The No-hands Company

# Directories
directories:
  buildResources: build-resources
  output: release

# Files to include in the packaged Electron app
files:
  - electron/**
  - package.json
  - "!node_modules"
  - "!src"
  - "!public"
  - "!scripts"
  - "!lore"
  - "!quests"
  - "!assets"
  - "!server"

# Vite-built game bundled as an extra resource so electron/main.js
# can locate it at process.resourcesPath/dist
extraResources:
  - from: dist
    to: dist
    filter:
      - "**/*"

# ── Windows ────────────────────────────────────────────────────────────────────
win:
  icon: build-resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis       # Full installer (.exe setup wizard)
      arch: [x64, ia32, arm64]
    - target: portable   # Single-file .exe, no install needed
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  menuCategory: Games
  shortcutName: Aethoria

# ── Linux ──────────────────────────────────────────────────────────────────────
linux:
  icon: build-resources/icons/
  category: Game
  maintainer: "The No-hands Company"
  description: "Aethoria — Solo & Co-op Open World RPG"
  target:
    - target: AppImage   # Universal — runs on any distro without install
      arch: [x64, arm64]
    - target: deb        # Debian / Ubuntu / Linux Mint
      arch: [x64, arm64]
    - target: rpm        # Fedora / RHEL / openSUSE
      arch: [x64, arm64]

# ── macOS ──────────────────────────────────────────────────────────────────────
# NOTE: macOS builds must be run on a Mac. Cross-compiling from Linux is
# unsupported by Apple's toolchain. The config is kept here so `npm run dist:mac`
# works when executed on a macOS machine.
mac:
  icon: build-resources/icon.icns
  category: public.app-category.games
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  title: "Aethoria ${version}"
  icon: build-resources/icon.icns
  contents:
    - x: 380
      y: 280
      type: link
      path: /Applications
    - x: 130
      y: 280
      type: file

